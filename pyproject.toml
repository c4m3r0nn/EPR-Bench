[project]
name = "eprbench"
version = "0.1.0"
description = "A self-contained, deterministic UK-style electronic patient record for benchmarking and training LLM agents"
requires-python = ">=3.11"
license = "Apache-2.0 AND CC-BY-4.0 AND OGL-UK-3.0"  # code; cases, bundles, docs; dm+d data (LICENSE-CONTENT.md)
license-files = ["LICENSE", "LICENSE-CONTENT.md", "NOTICE"]
authors = [{ name = "Dr Cameron Dent" }]
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/c4m3r0nn/EPR-Bench"
Issues = "https://github.com/c4m3r0nn/EPR-Bench/issues"

[project.optional-dependencies]
agents = ["anthropic"]
gemini = ["google-genai"]
openai = ["openai"]
browser = ["playwright>=1.45"]

[project.scripts]
eprbench = "eprbench.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eprbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
